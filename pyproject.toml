[project]
name = "agent-runtime-python"
version = "0.0.0"
description = "Python subsystems for agent-runtime (MCP adapters)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/mcp-adapters"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "packages/mcp-adapters/tests"]
python_files = ["test_*.py"]
